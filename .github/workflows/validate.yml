name: Validate skill and studio
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check scripts/studio-server.mjs
      - run: node --check ui/app.mjs
      - run: node --check scripts/acceptance.mjs
      - run: node --check scripts/acceptance-checks.mjs
      - run: node --check scripts/acceptance-verify.mjs
